<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8D%AD</text></svg>">
  <meta name="description" content="A sweet peek at Sweet Wheels in action — fresh cotton candy clouds, golden funnel cakes, and happy faces at events near you.">
  <meta name="keywords" content="cotton candy photos, funnel cake photos, food truck gallery, carnival dessert photos">
  <link rel="canonical" href="https://sweetwheels.com/gallery.html">
  <script>
    if (localStorage.getItem('darkMode') === 'true') {
      document.documentElement.classList.add('dark');

</head>
<body class="bg-pink-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans">

  <div id="navbar"></div>

  <!-- Hero -->
  <section class="relative min-h-[45vh] flex items-center overflow-hidden pt-16 bg-cover bg-center" style="background-image:url('assets/images/dessert3.jpg');">
    <div class="absolute inset-0 bg-gradient-to-br from-pink-700/85 via-fuchsia-800/80 to-purple-900/85 dark:from-pink-950/90 dark:via-fuchsia-950/85 dark:to-purple-950/90"></div>
    <div class="absolute inset-0 bg-grid opacity-20"></div>
    <div class="absolute top-16 right-16 w-72 h-72 bg-white/10 rounded-full blur-3xl candy-float"></div>
    <div class="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-16 md:py-24 text-center" data-aos="fade-up">
      <span class="inline-block px-4 py-2 bg-white/15 backdrop-blur-sm rounded-full text-white/90 text-sm font-bold uppercase tracking-wider mb-6"><i class="fas fa-camera mr-2 rtl:ml-2 rtl:mr-0"></i>Gallery</span>

        Sweetness, <span class="text-yellow-300">Captured</span>

  <!-- Gallery -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

      <!-- Grid -->

            </div>
          </figcaption>
        </figure>

        <figure class="gallery-item funnel-cakes glass-card rounded-2xl overflow-hidden card-hover relative group cursor-pointer" data-aos="fade-up" data-aos-delay="150">
          <div class="h-72 overflow-hidden">
            <img src="assets/images/funnel-cake.jpg" alt="Golden funnel cake with powdered sugar" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
          </div>
          <figcaption class="absolute inset-0 bg-gradient-to-t from-purple-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end">
            <div class="p-5">
              <div class="text-[10px] font-bold uppercase tracking-wider text-purple-200 mb-1">Funnel Cakes</div>

          </div>
          <figcaption class="absolute inset-0 bg-gradient-to-t from-pink-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end">
            <div class="p-5">

          </div>
          <figcaption class="absolute inset-0 bg-gradient-to-t from-pink-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end">
            <div class="p-5">
              <div class="text-[10px] font-bold uppercase tracking-wider text-pink-200 mb-1">Events</div>
              <div class="text-white font-bold">City Fair Nights</div>

        <figure class="gallery-item cotton-candy glass-card rounded-2xl overflow-hidden card-hover relative group cursor-pointer" data-aos="fade-up" data-aos-delay="300">

        </figure>

        <figure class="gallery-item funnel-cakes glass-card rounded-2xl overflow-hidden card-hover relative group cursor-pointer" data-aos="fade-up" data-aos-delay="350">
          <div class="h-72 overflow-hidden">
            <img src="assets/images/dessert2.jpg" alt="Strawberry topped funnel cake" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
          </div>
          <figcaption class="absolute inset-0 bg-gradient-to-t from-purple-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end">
            <div class="p-5">
              <div class="text-[10px] font-bold uppercase tracking-wider text-purple-200 mb-1">Funnel Cakes</div>
              <div class="text-white font-bold">Strawberry Dreamsicle</div>
            </div>
          </figcaption>
        </figure>

        <figure class="gallery-item cotton-candy glass-card rounded-2xl overflow-hidden card-hover relative group cursor-pointer" data-aos="fade-up" data-aos-delay="400">
          <div class="h-72 overflow-hidden">
            <img src="assets/images/dessert3.jpg" alt="Colorful cotton candy treats" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
          </div>
          <figcaption class="absolute inset-0 bg-gradient-to-t from-pink-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end">
            <div class="p-5">
              <div class="text-[10px] font-bold uppercase tracking-wider text-pink-200 mb-1">Cotton Candy</div>

        <figure class="gallery-item the-truck glass-card rounded-2xl overflow-hidden card-hover relative group cursor-pointer" data-aos="fade-up" data-aos-delay="500">
          <div class="h-72 overflow-hidden">
            <img src="assets/images/waffle2.jpg" alt="Waffle cone treats from the truck" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
          </div>
          <figcaption class="absolute inset-0 bg-gradient-to-t from-pink-900/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end">
            <div class="p-5">
              <div class="text-[10px] font-bold uppercase tracking-wider text-pink-200 mb-1">The Truck</div>

            </div>

      </div>
    </div>

  <!-- CTA -->
  <section class="py-20 lg:py-28 relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-r from-pink-500 via-fuchsia-500 to-purple-600"></div>
    <div class="absolute inset-0 bg-dots opacity-30"></div>
    <div class="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center" data-aos="fade-up">
      <span class="text-6xl mb-6 block candy-float" aria-hidden="true">📸</span>
      <h2 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white mb-6">Want Sweet Photos of Your Own?</h2>
      <p class="text-xl text-pink-50/90 mb-10 max-w-2xl mx-auto">Tag us on Instagram or book the truck — new memories are always in the making.</p>
      <div class="flex flex-wrap justify-center gap-4">
        <a href="contact.html" class="inline-flex items-center px-8 py-4 bg-white text-pink-600 font-bold rounded-full shadow-2xl hover:-translate-y-1 transition-all duration-300">
          Book Us
          <svg class="w-5 h-5 ml-2 rtl:mr-2 rtl:ml-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </a>
        <a href="locations.html" class="inline-flex items-center px-8 py-4 bg-white/20 backdrop-blur-sm text-white border-2 border-white/40 font-bold rounded-full hover:bg-white/30 transition-all duration-300">See Our Schedule</a>
      </div>
    </div>

  <div id="footer"></div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>AOS.init();</script>
  <script src="js/darkmode.js" defer></script>
  <script src="js/navbar.js" defer></script>
  <script src="js/footer.js" defer></script>
  <script src="js/main.js" defer></script>
  <style>
    .filter-btn {
      background: #fce7f3;
      color: #db2777;
    }
    .dark .filter-btn {
      background: rgba(236, 72, 153, 0.15);
      color: #f9a8d4;
    }
    .filter-btn:hover {
      transform: translateY(-2px);
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #ec4899, #a855f7);
      color: #fff;
      box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.5);
    }
    .gallery-item.hidden-item {
      display: none;
    }
  </style>
  <script>
    (function () {
      const btns = document.querySelectorAll('.filter-btn');
      const items = document.querySelectorAll('.gallery-item');
      btns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          btns.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          const filter = btn.getAttribute('data-filter');
          items.forEach(function (item) {
            const show = filter === 'all' || item.classList.contains(filter);
            item.classList.toggle('hidden-item', !show);
            item.style.display = show ? '' : 'none';
          });
          if (window.AOS) AOS.refreshHard();
        });
      });
    })();
  </script>
</body>
</html>
